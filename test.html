<!DOCTYPE html>

<style>

    color:white;

button {
    background:#0b3d91;

    cursor:pointer;

}

.card {
    background:#0b2554;

    border-radius:15px;
    padding:20px;
    margin:25px auto;
    max-width:700px;
    text-align:left;

.card h2 {

}

input {
    background:#06142f;
    color:white;
    border:2px solid #4da6ff;
    padding:15px;
    width:80%;
    max-width:500px;
    border-radius:10px;
    font-size:16px;
}

hr {
    border:0;
    border-top:1px solid #4da6ff;
    margin:20px 0;
}

</style>

function searchAircraft() {

let search = document
.getElementById("searchBox")
.value
.toLowerCase();

let aircraft = document
.querySelectorAll(".aircraft");

aircraft.forEach(function(card) {

let name = card
.querySelector("h2")
.innerText
.toLowerCase();

if (name.includes(search)) {

card.style.display = "block";

} else {

card.style.display = "none";

}

});

}
